[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqldistill"
version = "0.1.0"
description = "Distilling text-to-SQL from a large teacher model into a small one, with execution-verified synthetic data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "José Miguel Luís Antunes" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
teacher = ["anthropic>=0.40"]
train = [
    "torch>=2.3",
    "transformers>=4.51",
    "peft>=0.13",
    "bitsandbytes>=0.43",
    "datasets>=3.0",
    "accelerate>=1.0",
]
demo = ["gradio>=5.0"]

[project.scripts]
sqldistill = "sqldistill.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sqldistill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
